name: Build Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter
    - name: Build with PyInstaller
      run: python -m PyInstaller --clean --onefile --windowed --name "NeoPOS-Installer-${{ github.ref_name }}" main.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: dist/NeoPOS-Installer-${{ github.ref_name }}.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter
    - name: Build with PyInstaller
      run: python -m PyInstaller --clean --onefile --windowed --name "NeoPOS-Installer-Linux-${{ github.ref_name }}" main.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-installer
        path: dist/NeoPOS-Installer-Linux-${{ github.ref_name }}

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: windows-installer
        path: release-files/
    - uses: actions/download-artifact@v4
      with:
        name: linux-installer
        path: release-files/
    - name: Stamp bundled NeoPOS release version
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: python scripts/stamp_neopos_release.py neopos-local.zip neopos-local-manifest.json
    - name: Keep stable download aliases
      run: |
        cp "release-files/NeoPOS-Installer-${GITHUB_REF_NAME}.exe" release-files/NeoPOS-Installer.exe
        cp "release-files/NeoPOS-Installer-Linux-${GITHUB_REF_NAME}" release-files/NeoPOS-Installer-Linux
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: NeoPOS Installer ${{ github.ref_name }}
        make_latest: true
        files: |
          release-files/*
          neopos-local.zip
          neopos-local-manifest.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
