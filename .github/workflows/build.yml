name: Build Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter
    - name: Build with PyInstaller
      run: python -m PyInstaller --onefile --windowed --name NeoPOS-Installer main.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: dist/NeoPOS-Installer.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter
    - name: Build with PyInstaller
      run: python -m PyInstaller --onefile --windowed --name NeoPOS-Installer-Linux main.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-installer
        path: dist/NeoPOS-Installer-Linux

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: windows-installer
        path: release-files/
    - uses: actions/download-artifact@v4
      with:
        name: linux-installer
        path: release-files/
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: NeoPOS Installer ${{ github.ref_name }}
        make_latest: true
        files: |
          release-files/*
          neopos-local.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
