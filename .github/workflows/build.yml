name: Build Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter
    - name: Validate and stamp production package
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: python scripts/stamp_neopos_release.py neopos-local.zip neopos-local-manifest.json
    - name: Build with PyInstaller
      run: python -m PyInstaller --clean --onefile --windowed --uac-admin --add-data "neopos-local.zip;." --name "NeoPOS-Installer-${{ github.ref_name }}" main.py
    - name: Build uninstaller with PyInstaller
      run: python -m PyInstaller --clean --onefile --windowed --uac-admin --name "NeoPOS-Uninstaller-${{ github.ref_name }}" uninstaller.py
    - name: Download Docker Desktop Installer for offline bundle
      run: |
        mkdir release-offline
        curl.exe -L -o "release-offline/Docker Desktop Installer.exe" "https://desktop.docker.com/win/main/amd64/Docker%20Desktop%20Installer.exe"
        copy "dist\NeoPOS-Installer-${{ github.ref_name }}.exe" "release-offline\NeoPOS-Installer.exe"
        copy "dist\NeoPOS-Installer-${{ github.ref_name }}.exe" "release-offline\NeoPOS-Installer-${{ github.ref_name }}.exe"
        copy "neopos-local.zip" "release-offline\neopos-local.zip"
        @"
        =====================================================
         NeoPOS - Instrucciones de Instalacion Offline
        =====================================================

        Este paquete esta preparado para instalar NeoPOS en equipos sin conexion a internet.

        Pasos:
        1. Descomprime este archivo ZIP completo en una carpeta local o memoria USB.
        2. Ejecuta "NeoPOS-Installer.exe" como Administrador.
        3. El instalador usara "Docker Desktop Installer.exe" y las imagenes preempaquetadas en neopos-local.zip sin necesidad de descargar nada de internet.
        4. Al terminar, ingresa a http://localhost:5173 con las credenciales creadas y configura la licencia.
        "@ | Out-File -FilePath "release-offline\INSTRUCCIONES_OFFLINE.txt" -Encoding utf8
        Compress-Archive -Path release-offline\* -DestinationPath "dist\NeoPOS-Offline-Bundle-${{ github.ref_name }}.zip" -Force
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-installer
        path: |
          dist/NeoPOS-Installer-${{ github.ref_name }}.exe
          dist/NeoPOS-Uninstaller-${{ github.ref_name }}.exe
          dist/NeoPOS-Offline-Bundle-${{ github.ref_name }}.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter
    - name: Test Linux installer behavior
      run: python -m unittest discover -s tests -v
    - name: Validate and stamp production package
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: python scripts/stamp_neopos_release.py neopos-local.zip neopos-local-manifest.json
    - name: Build with PyInstaller
      run: python -m PyInstaller --clean --onefile --windowed --add-data "neopos-local.zip:." --name "NeoPOS-Installer-Linux-${{ github.ref_name }}" main.py
    - name: Build uninstaller with PyInstaller
      run: python -m PyInstaller --clean --onefile --windowed --name "NeoPOS-Uninstaller-Linux-${{ github.ref_name }}" uninstaller.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: linux-installer
        path: |
          dist/NeoPOS-Installer-Linux-${{ github.ref_name }}
          dist/NeoPOS-Uninstaller-Linux-${{ github.ref_name }}

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: windows-installer
        path: release-files/
    - uses: actions/download-artifact@v4
      with:
        name: linux-installer
        path: release-files/
    - name: Stamp bundled NeoPOS release version
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: python scripts/stamp_neopos_release.py neopos-local.zip neopos-local-manifest.json
    - name: Keep stable download aliases
      run: |
        cp "release-files/NeoPOS-Installer-${GITHUB_REF_NAME}.exe" release-files/NeoPOS-Installer.exe
        cp "release-files/NeoPOS-Uninstaller-${GITHUB_REF_NAME}.exe" release-files/NeoPOS-Uninstaller.exe
        cp "release-files/NeoPOS-Installer-Linux-${GITHUB_REF_NAME}" release-files/NeoPOS-Installer-Linux
        cp "release-files/NeoPOS-Uninstaller-Linux-${GITHUB_REF_NAME}" release-files/NeoPOS-Uninstaller-Linux
        cp "release-files/NeoPOS-Offline-Bundle-${GITHUB_REF_NAME}.zip" release-files/NeoPOS-Offline-Bundle.zip || true
    - name: Render release notes from manifest
      run: python scripts/render_release_notes.py neopos-local-manifest.json release-notes.md
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: NeoPOS Installer ${{ github.ref_name }}
        body_path: release-notes.md
        make_latest: true
        files: |
          release-files/*
          neopos-local.zip
          neopos-local-manifest.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
